  <text x="612" y="224" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111827">주간 출석률</text>
  <!-- Chart baseline -->
  <line x1="612" y1="442" x2="760" y2="442" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Bars -->
  <rect x="618" y="358" width="20" height="84" rx="4" fill="#a78bfa"/>
  <rect x="648" y="334" width="20" height="108" rx="4" fill="#6c63ff"/>
  <rect x="678" y="370" width="20" height="72" rx="4" fill="#a78bfa"/>
  <rect x="708" y="318" width="20" height="124" rx="4" fill="#6c63ff"/>
  <rect x="738" y="348" width="20" height="94" rx="4" fill="#a78bfa"/>

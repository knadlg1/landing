<svg width="300" height="520" viewBox="0 0 300 520" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone background -->
  <rect width="300" height="520" fill="#f5f0e8" rx="4"/>

  <!-- Status bar -->
  <rect width="300" height="36" fill="#1a1a1a"/>
  <text x="14" y="24" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">9:41</text>
  <text x="258" y="24" font-family="Arial,sans-serif" font-size="10" fill="#fff">●●● 100%</text>

  <!-- KakaoTalk header -->
  <rect x="0" y="36" width="300" height="52" fill="#FEE500"/>
  <!-- Back arrow -->
  <path d="M18 62 L10 55 L18 48" fill="none" stroke="#3C1E1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chat room name -->
  <text x="132" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="900" fill="#1a1a1a">실습출결 단체방</text>
  <text x="132" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555">학생 26명</text>
  <!-- Hamburger menu -->
  <line x1="276" y1="54" x2="290" y2="54" stroke="#3C1E1E" stroke-width="2" stroke-linecap="round"/>
  <line x1="276" y1="62" x2="290" y2="62" stroke="#3C1E1E" stroke-width="2" stroke-linecap="round"/>
  <line x1="276" y1="70" x2="290" y2="70" stroke="#3C1E1E" stroke-width="2" stroke-linecap="round"/>

  <!-- Chat area -->
  <rect x="0" y="88" width="300" height="432" fill="#b2c7d8"/>

  <!-- Date separator -->
  <rect x="90" y="100" width="120" height="22" rx="11" fill="rgba(0,0,0,0.2)"/>
  <text x="150" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff">2026년 5월 30일</text>

  <!-- Message 1: 김간호 - 출근 -->
  <circle cx="28" cy="148" r="14" fill="#a78bfa"/>
  <text x="28" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">김</text>
  <text x="50" y="138" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#333">김간호</text>
  <rect x="50" y="143" width="110" height="32" rx="0" rx="0" rx="4" fill="#fff"/>
  <rect x="50" y="143" width="110" height="32" rx="4" fill="#fff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))"/>
  <text x="60" y="162" font-family="Arial,sans-serif" font-size="13" fill="#1a1a1a">출근했습니다!</text>
  <text x="166" y="174" font-family="Arial,sans-serif" font-size="10" fill="#888">09:02</text>

  <!-- Message 2: 박민지 - 출근 -->
  <circle cx="28" cy="200" r="14" fill="#f97316"/>
  <text x="28" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">박</text>
  <text x="50" y="190" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#333">박민지</text>
  <rect x="50" y="195" width="90" height="32" rx="4" fill="#fff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))"/>
  <text x="60" y="215" font-family="Arial,sans-serif" font-size="13" fill="#1a1a1a">출근이요~</text>
  <text x="146" y="226" font-family="Arial,sans-serif" font-size="10" fill="#888">09:17</text>

  <!-- Message 3: 이서연 -->
  <circle cx="28" cy="252" r="14" fill="#059669"/>
  <text x="28" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">이</text>
  <text x="50" y="242" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#333">이서연</text>
  <rect x="50" y="247" width="156" height="32" rx="4" fill="#fff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))"/>
  <text x="60" y="267" font-family="Arial,sans-serif" font-size="12" fill="#1a1a1a">선생님 저 지금 나왔어요</text>
  <text x="212" y="278" font-family="Arial,sans-serif" font-size="10" fill="#888">09:31</text>

  <!-- Message 4: 최유진 -->
  <circle cx="28" cy="302" r="14" fill="#dc2626"/>
  <text x="28" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">최</text>
  <text x="50" y="292" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#333">최유진</text>
  <rect x="50" y="297" width="116" height="32" rx="4" fill="#fff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))"/>
  <text x="60" y="317" font-family="Arial,sans-serif" font-size="13" fill="#1a1a1a">출근합니다 😊</text>
  <text x="172" y="328" font-family="Arial,sans-serif" font-size="10" fill="#888">09:44</text>

  <!-- Unread separator -->
  <rect x="60" y="338" width="180" height="20" rx="10" fill="rgba(255,80,80,0.75)"/>
  <text x="150" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">읽지않은 메시지 18개 ↓</text>

  <!-- Message 5: 정하은 -->
  <circle cx="28" cy="378" r="14" fill="#6c63ff"/>
  <text x="28" y="383" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">정</text>
  <text x="50" y="368" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#333">정하은</text>
  <rect x="50" y="373" width="96" height="32" rx="4" fill="#fff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))"/>
  <text x="60" y="393" font-family="Arial,sans-serif" font-size="13" fill="#1a1a1a">퇴근합니다!</text>
  <text x="152" y="404" font-family="Arial,sans-serif" font-size="10" fill="#888">18:02</text>

  <!-- Message 6: 김간호 퇴근 -->
  <circle cx="28" cy="428" r="14" fill="#a78bfa"/>
  <text x="28" y="433" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">김</text>
  <text x="50" y="418" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#333">김간호</text>
  <rect x="50" y="423" width="136" height="32" rx="4" fill="#fff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.1))"/>
  <text x="60" y="443" font-family="Arial,sans-serif" font-size="12" fill="#1a1a1a">퇴근했습니다~ 감사해요</text>
  <text x="192" y="454" font-family="Arial,sans-serif" font-size="10" fill="#888">18:15</text>

  <!-- Notification badge on header -->
  <circle cx="270" cy="42" r="9" fill="#ff3b30"/>
  <text x="270" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">26</text>

  <!-- Input bar -->
  <rect x="0" y="476" width="300" height="44" fill="#f0ede6"/>
  <rect x="10" y="484" width="220" height="28" rx="14" fill="#fff"/>
  <text x="28" y="502" font-family="Arial,sans-serif" font-size="12" fill="#aaa">메시지 입력</text>
  <rect x="242" y="484" width="48" height="28" rx="14" fill="#FEE500"/>
  <text x="266" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3C1E1E">전송</text>
</svg>

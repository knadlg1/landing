  <text x="332" y="438" font-family="Arial,sans-serif" font-size="14" fill="#111827">08:58</text>
  <rect x="416" y="422" width="52" height="24" rx="12" fill="#dcfce7"/>
  <text x="442" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">출석</text>
  <text x="500" y="438" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">GPS</text>
  <line x1="240" y1="456" x2="552" y2="456" stroke="#e5e7eb" stroke-width="1"/>
  <text x="240" y="470" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">... 외 22명</text>


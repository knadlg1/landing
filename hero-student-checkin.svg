  <circle cx="195" cy="430" r="82" fill="rgba(108,99,255,0.07)"/>
  <circle cx="195" cy="430" r="52" fill="rgba(108,99,255,0.12)"/>
  <circle cx="195" cy="430" r="28" fill="rgba(108,99,255,0.22)"/>

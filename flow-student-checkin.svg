<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f9fafb"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#1e1b4b"/>
  <text x="20" y="30" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">9:03</text>
  <text x="355" y="30" font-family="Arial,sans-serif" font-size="11" fill="#fff">●●●</text>

  <!-- Header -->
  <rect x="0" y="44" width="390" height="56" fill="#1e1b4b"/>
  <text x="24" y="78" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#ffffff">GPS 출근하기</text>
  <text x="24" y="96" font-family="Arial,sans-serif" font-size="11" fill="#c4b5fd">실습병원 위치를 확인하는 중...</text>

  <!-- Status indicator strips -->
  <!-- Step progress: 1=기기인증 2=카카오인증 3=GPS확인 -->
  <rect x="0" y="100" width="390" height="6" fill="#e5e7eb"/>
  <rect x="0" y="100" width="260" height="6" fill="#6c63ff"/>

  <!-- Auth badges row -->
  <rect x="16" y="122" width="358" height="52" rx="12" fill="#ffffff" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.06))"/>
  <rect x="30" y="136" width="24" height="24" rx="6" fill="#dcfce7"/>
  <text x="42" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#059669">✓</text>
  <text x="64" y="149" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#059669">기기 인증 완료</text>
  <line x1="176" y1="132" x2="176" y2="164" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="188" y="136" width="24" height="24" rx="6" fill="#dcfce7"/>
  <text x="200" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#059669">✓</text>
  <text x="222" y="149" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#059669">카카오 인증 완료</text>
  <line x1="334" y1="132" x2="334" y2="164" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="344" y="136" width="24" height="24" rx="6" fill="#fef3c7"/>
  <text x="356" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b">⟳</text>

  <!-- Hospital name -->
  <rect x="16" y="190" width="358" height="64" rx="12" fill="#ffffff" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.06))"/>
  <text x="40" y="218" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">배정 실습병원</text>
  <text x="40" y="240" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="#111827">서울대학교병원 내과병동</text>

  <!-- GPS visual center piece -->
  <circle cx="195" cy="430" r="130" fill="url(#pulseGrad)"/>
  <circle cx="195" cy="430" r="95" fill="rgba(108,99,255,0.08)"/>
  <circle cx="195" cy="430" r="64" fill="rgba(108,99,255,0.14)"/>
  <!-- Dashed outer ring -->
  <circle cx="195" cy="430" r="95" fill="none" stroke="#6c63ff" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.6"/>
  <!-- Inner solid ring -->
  <circle cx="195" cy="430" r="64" fill="none" stroke="#6c63ff" stroke-width="2" opacity="0.4"/>

  <!-- Pin shadow -->
  <ellipse cx="195" cy="458" rx="12" ry="5" fill="rgba(0,0,0,0.12)"/>
  <!-- Hospital pin -->
  <path d="M195 400 C182 400 172 410 172 421 C172 435 195 458 195 458 C195 458 218 435 218 421 C218 410 208 400 195 400Z" fill="#6c63ff"/>
  <circle cx="195" cy="421" r="9" fill="#ffffff"/>

  <!-- GPS scanning animation lines -->
  <line x1="195" y1="310" x2="195" y2="330" stroke="#6c63ff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <line x1="280" y1="340" x2="264" y2="354" stroke="#6c63ff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="110" y1="340" x2="126" y2="354" stroke="#6c63ff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- Checking text -->
  <text x="195" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6c63ff">GPS 위치 확인 중...</text>
  <text x="195" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">현재 위치가 실습병원 반경 내인지 확인합니다</text>

  <!-- Time -->
  <text x="195" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#111827" letter-spacing="-2">09:03</text>
  <text x="195" y="588" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">2026.05.30 금요일</text>

  <!-- Button (active state - in range) -->
  <rect x="32" y="612" width="326" height="70" rx="18" fill="#6c63ff" filter="drop-shadow(0 6px 20px rgba(108,99,255,0.45))"/>
  <text x="195" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="900" fill="#ffffff">출근하기</text>
  <text x="195" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.78)">탭하여 출근 시간을 기록합니다</text>

  <text x="195" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">GPS 반경 200m 내 위치 확인됨</text>

  <!-- Bottom nav -->
  <rect x="0" y="758" width="390" height="86" fill="#ffffff" filter="drop-shadow(0 -1px 6px rgba(0,0,0,0.06))"/>
  <line x1="0" y1="758" x2="390" y2="758" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="51" y="762" width="52" height="3" rx="1.5" fill="#6c63ff"/>
  <text x="77" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">🏠</text>
  <text x="77" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6c63ff" font-weight="700">홈</text>
  <text x="163" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">📋</text>
  <text x="163" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">출결내역</text>
  <text x="249" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">📄</text>
  <text x="249" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">서류</text>
  <text x="335" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">👤</text>
  <text x="335" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">내 정보</text>
</svg>

  <circle cx="356" cy="74" r="16" fill="rgba(255,255,255,0.15)"/>
  <circle cx="356" cy="69" r="6" fill="rgba(255,255,255,0.75)"/>
  <path d="M345 83 Q356 77 367 83" fill="rgba(255,255,255,0.75)" stroke="none"/>


  <rect x="32" y="608" width="326" height="70" rx="18" fill="#6c63ff" filter="drop-shadow(0 6px 20px rgba(108,99,255,0.45))"/>
  <text x="195" y="647" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="900" fill="#ffffff">출근하기</text>
  <text x="195" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.78)">GPS + 카카오 3중 인증</text>

  <text x="195" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">실습병원 반경 내에서만 출근이 가능합니다</text>

  <!-- Bottom nav -->
  <rect x="0" y="758" width="390" height="86" fill="#ffffff" filter="drop-shadow(0 -1px 6px rgba(0,0,0,0.06))"/>
  <line x1="0" y1="758" x2="390" y2="758" stroke="#e5e7eb" stroke-width="1"/>

  <rect x="16" y="225" width="358" height="52" rx="12" fill="#ffffff" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.06))"/>
  <rect x="30" y="237" width="28" height="28" rx="8" fill="#FEE500"/>
  <text x="44" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">💬</text>
  <text x="70" y="252" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">카카오 로그인</text>
  <text x="70" y="268" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">김간호 (본인 인증 완료)</text>

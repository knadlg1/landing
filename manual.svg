<svg width="300" height="520" viewBox="0 0 300 520" xmlns="http://www.w3.org/2000/svg">
  <!-- Desk background -->
  <rect width="300" height="520" fill="#f5f0e4"/>

  <!-- Shadow under papers -->
  <rect x="30" y="72" width="240" height="300" rx="4" fill="rgba(0,0,0,0.08)" transform="translate(4,4)"/>
  <rect x="20" y="192" width="240" height="300" rx="4" fill="rgba(0,0,0,0.06)" transform="translate(6,6)"/>

  <!-- Back paper (slightly rotated) -->
  <g transform="rotate(-3, 150, 280)">
    <rect x="20" y="190" width="240" height="300" rx="4" fill="#fffde8" stroke="#e0d8b0" stroke-width="1"/>
  </g>

  <!-- Main spreadsheet paper -->
  <rect x="30" y="70" width="240" height="310" rx="4" fill="#ffffff" stroke="#d4cba8" stroke-width="1" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.12))"/>

  <!-- Paper header -->
  <rect x="30" y="70" width="240" height="36" rx="4" fill="#f0ece0"/>
  <rect x="30" y="92" width="240" height="14" fill="#f0ece0"/>
  <text x="150" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="900" fill="#3d3520">실습 출결 관리대장</text>
  <text x="150" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#888">2026년 5월 · A반</text>

  <!-- Table header row -->
  <rect x="30" y="114" width="240" height="24" fill="#e8e4d0"/>
  <line x1="72" y1="114" x2="72" y2="380" stroke="#d0c8a8" stroke-width="1"/>
  <line x1="124" y1="114" x2="124" y2="380" stroke="#d0c8a8" stroke-width="1"/>
  <line x1="172" y1="114" x2="172" y2="380" stroke="#d0c8a8" stroke-width="1"/>
  <line x1="220" y1="114" x2="220" y2="380" stroke="#d0c8a8" stroke-width="1"/>
  <text x="51" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#555">이름</text>
  <text x="98" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#555">출근</text>
  <text x="148" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#555">퇴근</text>
  <text x="196" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#555">시간</text>
  <text x="250" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#555">비고</text>

  <!-- Data rows -->
  <!-- Row 1 -->
  <line x1="30" y1="154" x2="270" y2="154" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">김간호</text>
  <text x="98" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">09:02</text>
  <text x="148" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">18:00</text>
  <text x="196" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#059669">8h</text>
  <!-- Handwritten O mark -->
  <circle cx="250" cy="145" r="7" fill="none" stroke="#1a73e8" stroke-width="2"/>

  <!-- Row 2 -->
  <line x1="30" y1="178" x2="270" y2="178" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">박민지</text>
  <text x="98" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b">09:17</text>
  <text x="148" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">17:55</text>
  <text x="196" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b">지각</text>
  <!-- Handwritten O mark -->
  <circle cx="250" cy="169" r="7" fill="none" stroke="#1a73e8" stroke-width="2"/>

  <!-- Row 3 -->
  <line x1="30" y1="202" x2="270" y2="202" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">이서연</text>
  <text x="98" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">?</text>
  <text x="148" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">?</text>
  <text x="196" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#dc2626">결석?</text>
  <!-- X mark -->
  <path d="M243 190 L257 204" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M257 190 L243 204" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Row 4 -->
  <line x1="30" y1="226" x2="270" y2="226" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">최유진</text>
  <text x="98" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">09:44</text>
  <text x="148" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">미확인</text>
  <text x="196" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">?</text>
  <circle cx="250" cy="217" r="7" fill="none" stroke="#1a73e8" stroke-width="2"/>

  <!-- Row 5 -->
  <line x1="30" y1="250" x2="270" y2="250" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">정하은</text>
  <text x="98" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">09:05</text>
  <text x="148" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">18:10</text>
  <text x="196" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#059669">9h</text>
  <circle cx="250" cy="241" r="7" fill="none" stroke="#1a73e8" stroke-width="2"/>

  <!-- Rows 6-10 lighter -->
  <line x1="30" y1="274" x2="270" y2="274" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#aaa">홍길동</text>
  <text x="98" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#aaa">09:12</text>
  <text x="148" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">미확인</text>
  <line x1="30" y1="298" x2="270" y2="298" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="51" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#aaa">강민서</text>
  <text x="148" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">미확인</text>
  <line x1="30" y1="322" x2="270" y2="322" stroke="#e0d8b8" stroke-width="0.5"/>
  <text x="150" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#bbb">... 외 19명</text>

  <!-- Correction scribble -->
  <path d="M88 218 L116 218" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Sticky note -->
  <g transform="rotate(3, 180, 360)">
    <rect x="148" y="335" width="110" height="80" rx="2" fill="#fef9c3" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
    <text x="155" y="354" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#854d0e">※ 확인 필요</text>
    <text x="155" y="369" font-family="Arial,sans-serif" font-size="9" fill="#78350f">이서연 결석 사유</text>
    <text x="155" y="382" font-family="Arial,sans-serif" font-size="9" fill="#78350f">확인 후 서류 작성</text>
    <text x="155" y="395" font-family="Arial,sans-serif" font-size="9" fill="#78350f">최유진 퇴근 재확인</text>
    <text x="155" y="408" font-family="Arial,sans-serif" font-size="9" fill="#b45309">→ 카톡 확인할것!</text>
  </g>

  <!-- Bottom label -->
  <rect x="0" y="435" width="300" height="85" fill="#f5f0e4"/>
  <!-- Pen illustration -->
  <g transform="translate(30, 448)">
    <rect x="0" y="0" width="8" height="40" rx="2" fill="#2d3a8c" transform="rotate(-30, 4, 20)"/>
    <polygon points="0,38 8,38 4,50" fill="#f0d060" transform="rotate(-30, 4, 20)"/>
  </g>
  <text x="150" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7c6f3a">수기로 하루에 몇 시간씩...</text>
  <text x="150" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#9a8c4f">26명 × 매일 = 끝없는 반복</text>
  <text x="150" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b8a870">카톡 확인 → 수기 기록 → 서류 작성</text>
  <text x="150" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b8a870">실수 → 재확인 → 다시 작성...</text>
</svg>

  <text x="628" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">월</text>
  <text x="658" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">화</text>
  <text x="688" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">수</text>
  <text x="718" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">목</text>
  <text x="748" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">금</text>
  <!-- Percentage labels -->
  <text x="628" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">82%</text>
  <text x="658" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6c63ff">90%</text>
  <text x="688" y="364" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">79%</text>
  <text x="718" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6c63ff">92%</text>
  <text x="748" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6b7280">85%</text>

  <!-- Quick action -->
  <rect x="220" y="500" width="558" height="72" rx="12" fill="#ede9fe"/>
  <text x="240" y="528" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#4d44e0">빠른 서류 생성</text>
  <text x="240" y="548" font-family="Arial,sans-serif" font-size="12" fill="#6c63ff">지각·결석 학생 서류를 클릭 한 번으로 즉시 생성합니다</text>
  <rect x="638" y="516" width="120" height="36" rx="8" fill="#6c63ff"/>
  <text x="698" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">서류 생성하기</text>
</svg>

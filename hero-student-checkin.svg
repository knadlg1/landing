  <path d="M195 406 C184 406 176 414 176 423 C176 435 195 456 195 456 C195 456 214 435 214 423 C214 414 206 406 195 406Z" fill="#6c63ff"/>
  <circle cx="195" cy="423" r="7" fill="#ffffff"/>


  <text x="195" y="552" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#111827" letter-spacing="-2">09:03</text>
  <text x="195" y="576" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">2026년 5월 30일 금요일</text>


<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#f9fafb"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#059669"/>
  <text x="20" y="30" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">18:01</text>
  <text x="355" y="30" font-family="Arial,sans-serif" font-size="11" fill="#fff">●●●</text>

  <!-- Header -->
  <rect x="0" y="44" width="390" height="56" fill="#059669"/>
  <text x="24" y="78" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#ffffff">퇴근 완료</text>
  <text x="24" y="96" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">오늘 실습이 기록되었습니다</text>

  <!-- Big success circle -->
  <circle cx="195" cy="240" r="80" fill="#dcfce7"/>
  <circle cx="195" cy="240" r="60" fill="#059669" filter="drop-shadow(0 4px 16px rgba(5,150,105,0.4))"/>
  <!-- Check mark -->
  <path d="M168 240 L186 258 L222 218" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="195" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="#059669">오늘 실습 완료!</text>
  <text x="195" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6b7280">수고하셨습니다, 김간호 학생</text>

  <!-- Time summary card -->
  <rect x="24" y="398" width="342" height="140" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.08))"/>
  <text x="195" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7280">오늘 실습 기록</text>
  <line x1="48" y1="440" x2="342" y2="440" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Time in -->
  <text x="56" y="472" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">출근</text>
  <text x="160" y="472" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="#111827">09:03</text>
  <rect x="244" y="456" width="80" height="24" rx="12" fill="#dcfce7"/>
  <text x="284" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">GPS 인증됨</text>

  <!-- Time out -->
  <text x="56" y="506" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">퇴근</text>
  <text x="160" y="506" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="#111827">18:01</text>
  <rect x="244" y="490" width="80" height="24" rx="12" fill="#dcfce7"/>
  <text x="284" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">GPS 인증됨</text>

  <!-- Total -->
  <line x1="48" y1="520" x2="342" y2="520" stroke="#e5e7eb" stroke-width="1"/>
  <text x="56" y="528" font-family="Arial,sans-serif" font-size="11" fill="#6b7280">실습 장소</text>
  <text x="160" y="528" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">서울대학교병원 내과병동</text>

  <!-- Hours big display -->
  <rect x="24" y="556" width="342" height="80" rx="16" fill="#ede9fe"/>
  <text x="195" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4d44e0">오늘 총 실습 시간</text>
  <text x="195" y="624" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#6c63ff">8시간 58분</text>

  <!-- This month summary -->
  <rect x="24" y="650" width="166" height="76" rx="12" fill="#ffffff" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.06))"/>
  <text x="107" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">이번 달 출석</text>
  <text x="107" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#6c63ff">18일</text>

  <rect x="200" y="650" width="166" height="76" rx="12" fill="#ffffff" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.06))"/>
  <text x="283" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">출석률</text>
  <text x="283" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#059669">96%</text>

  <!-- Bottom nav -->
  <rect x="0" y="758" width="390" height="86" fill="#ffffff" filter="drop-shadow(0 -1px 6px rgba(0,0,0,0.06))"/>
  <line x1="0" y1="758" x2="390" y2="758" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="51" y="762" width="52" height="3" rx="1.5" fill="#6c63ff"/>
  <text x="77" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">🏠</text>
  <text x="77" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6c63ff" font-weight="700">홈</text>
  <text x="163" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">📋</text>
  <text x="163" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">출결내역</text>
  <text x="249" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">📄</text>
  <text x="249" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">서류</text>
  <text x="335" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">👤</text>
  <text x="335" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">내 정보</text>
</svg>

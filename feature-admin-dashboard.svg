<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f9fafb"/>

  <!-- Sidebar -->
  <rect width="200" height="600" fill="#1e1b4b"/>
  <text x="24" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#ffffff">Here</text>
  <text x="24" y="70" font-family="Arial,sans-serif" font-size="11" fill="#c4b5fd">원장님 관리 화면</text>

  <!-- Sidebar nav -->
  <rect x="12" y="100" width="176" height="40" rx="8" fill="#6c63ff"/>
  <text x="44" y="125" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">대시보드</text>
  <text x="44" y="180" font-family="Arial,sans-serif" font-size="14" fill="#c4b5fd">학생관리</text>
  <text x="44" y="224" font-family="Arial,sans-serif" font-size="14" fill="#c4b5fd">출결현황</text>
  <text x="44" y="268" font-family="Arial,sans-serif" font-size="14" fill="#c4b5fd">문서생성</text>
  <text x="44" y="312" font-family="Arial,sans-serif" font-size="14" fill="#c4b5fd">설정</text>

  <!-- Main content area -->
  <rect x="200" y="0" width="600" height="600" fill="#f9fafb"/>

  <!-- Top bar -->
  <rect x="200" y="0" width="600" height="60" fill="#ffffff" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.06))"/>
  <text x="224" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#111827">대시보드</text>
  <text x="224" y="54" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">오늘의 실습 출결 현황 · 2026.05.30</text>

  <!-- Stat cards -->
  <!-- Card 1: 출석 -->
  <rect x="220" y="80" width="126" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.05))"/>
  <text x="238" y="108" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">출석</text>
  <text x="238" y="148" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#059669">22</text>
  <text x="290" y="148" font-family="Arial,sans-serif" font-size="18" fill="#94a3b8">/26</text>
  <text x="238" y="168" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">전체 학생</text>

  <!-- Card 2: 지각 -->
  <rect x="362" y="80" width="126" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.05))"/>
  <text x="380" y="108" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">지각</text>
  <text x="380" y="148" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#f59e0b">3</text>
  <text x="380" y="168" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">명</text>

  <!-- Card 3: 결석 -->
  <rect x="504" y="80" width="126" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="drop-shadow(0 1px 4px rgba(0,0,0,0.05))"/>
  <text x="522" y="108" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">결석</text>
  <text x="522" y="148" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#dc2626">1</text>
  <text x="522" y="168" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">명</text>

  <!-- Card 4: 출석률 -->
  <rect x="646" y="80" width="132" height="96" rx="12" fill="#6c63ff" filter="drop-shadow(0 4px 12px rgba(108,99,255,0.3))"/>
  <text x="666" y="108" font-family="Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">출석률</text>
  <text x="666" y="148" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#ffffff">88%</text>
  <text x="666" y="168" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">오늘 기준</text>


  <text x="332" y="300" font-family="Arial,sans-serif" font-size="14" fill="#111827">09:02</text>
  <rect x="416" y="284" width="52" height="24" rx="12" fill="#dcfce7"/>
  <text x="442" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">출석</text>
  <text x="500" y="300" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">GPS</text>
  <line x1="240" y1="318" x2="552" y2="318" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="240" y="346" font-family="Arial,sans-serif" font-size="14" fill="#111827">박민지</text>
  <text x="332" y="346" font-family="Arial,sans-serif" font-size="14" fill="#111827">09:17</text>
  <rect x="416" y="330" width="52" height="24" rx="12" fill="#fef3c7"/>
  <text x="442" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#b45309">지각</text>
  <text x="500" y="346" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">GPS</text>
  <line x1="240" y1="364" x2="552" y2="364" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="240" y="392" font-family="Arial,sans-serif" font-size="14" fill="#111827">이서연</text>
  <text x="332" y="392" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">--:--</text>
  <rect x="416" y="376" width="52" height="24" rx="12" fill="#fee2e2"/>
  <text x="442" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#dc2626">결석</text>
  <text x="500" y="392" font-family="Arial,sans-serif" font-size="13" fill="#94a3b8">대기</text>
  <line x1="240" y1="410" x2="552" y2="410" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 4 -->

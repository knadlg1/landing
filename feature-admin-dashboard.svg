  <text x="332" y="262" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6b7280">시간</text>
  <text x="420" y="262" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6b7280">상태</text>
  <text x="500" y="262" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6b7280">인증</text>
  <line x1="240" y1="272" x2="552" y2="272" stroke="#e5e7eb" stroke-width="1"/>

